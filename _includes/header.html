<a class="skip-link" href="#main-content">Skip to content</a>
<header class="site-header" data-header>
  <div class="container header-inner">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="VeyaBio home">
      <img src="{{ '/assets/images/veyabio-logo.png' | relative_url }}" alt="VeyaBio" width="1200" height="285">
    </a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" data-nav-toggle>
      <span class="nav-toggle-label">Menu</span>
      <span class="nav-toggle-lines" aria-hidden="true"><i></i><i></i></span>
    </button>
    <nav class="site-nav" id="site-nav" aria-label="Primary navigation" data-nav>
      {% for item in site.data.navigation %}
        {% assign item_url = item.url | relative_url %}
        <a href="{{ item_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.label }}</a>
      {% endfor %}
    </nav>
  </div>
</header>
